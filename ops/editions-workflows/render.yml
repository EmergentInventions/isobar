# Lives in EmergentInventions/isobar-editions. Renders a draft after the editorial step,
# and the final video when the host's voice take (voice.m4a/.mp3/.wav) is uploaded.
name: render
on:
  push:
    paths: ["editions/*/editorial.json", "editions/*/voice.*"]
  workflow_dispatch:
    inputs:
      date: { description: "YYYY-MM-DD (UTC)", required: false }
      kind: { description: "draft or final", required: false, default: draft }
      code_ref: { description: "isobar branch to render with (e.g. engaging)", required: false, default: main }
concurrency:
  group: render
  cancel-in-progress: true
permissions: { contents: write }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/checkout@v4
        with: { repository: EmergentInventions/isobar, path: code, ref: "${{ inputs.code_ref || 'main' }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: code/requirements.txt }
      - uses: actions/cache@v4      # Kokoro voice model (~350 MB), downloaded once
        with: { path: ~/.cache/kokoro, key: kokoro-v1.0 }
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg festival festvox-us-slt-hts >/dev/null
          sudo chmod a+w /usr/local/bin
          pip install -r code/requirements.txt
      - name: Work out date and kind
        run: |
          DATE="${{ inputs.date }}"; KIND="${{ inputs.kind }}"
          if [ -z "$DATE" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '^editions/' | head -1)
            DATE=$(echo "$CHANGED" | cut -d/ -f2); DATE="${DATE:-$(date -u +%F)}"
            echo "$CHANGED" | grep -q '/voice\.' && KIND=final || KIND=draft
          fi
          echo "DATE=$DATE" >> "$GITHUB_ENV"; echo "KIND=${KIND:-draft}" >> "$GITHUB_ENV"
      - name: Script, voice, render
        env: { PYTHONPATH: code }
        run: |
          ED="editions/$DATE"
          python -m isobar.script --base . --date "$DATE"
          python -m isobar.photos fetch "$ED" || echo "photos: fetch skipped"
          python -m isobar.voice "$ED"
          if [ "$KIND" = final ]; then
            curl -sL -o /usr/local/bin/deep-filter https://github.com/Rikorose/DeepFilterNet/releases/download/v0.5.6/deep-filter-0.5.6-x86_64-unknown-linux-musl || true
            chmod +x /usr/local/bin/deep-filter || true
            pip install -q -r code/requirements-voice.txt || true
            TAKE=$(ls $ED/voice.* | head -1)
            python -m isobar.voice "$ED" --take "$TAKE"
            python code/isobar/render.py "$ED" --audio audio_final --out "isobar-$DATE.mp4"
            python -m isobar.description "$ED" --audio audio_final
          else
            python -m isobar.tts_draft "$ED"
            python code/isobar/render.py "$ED" --audio audio_draft --out "isobar-$DATE-draft.mp4"
            python -m isobar.description "$ED" --audio audio_draft
            python -m isobar.shorts "$ED" || echo "shorts: failed (main video unaffected)"
          fi
          python -m isobar.social "$ED" || echo "social: failed (videos unaffected)"
          [ -f "$ED/photos.json" ] && python -m isobar.photos sheet "$ED" || true
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ED="editions/$DATE"; P="isobar-$DATE"; R="$RUNNER_TEMP/release"; rm -rf "$R"; mkdir -p "$R"
          # every release file is named isobar-<DATE>-...; the edition folder keeps its usual internal names
          cp $ED/isobar-$DATE*.mp4 $ED/isobar-$DATE*.srt "$R"/ 2>/dev/null || true
          cp $ED/shorts/isobar-$DATE-short*.mp4 $ED/shorts/isobar-$DATE-short*.txt "$R"/ 2>/dev/null || true
          cp $ED/social/isobar-$DATE-social-*.txt "$R"/ 2>/dev/null || true
          for pair in recording.md:recording.md description.txt:description.txt title.txt:title.txt thumbnail.png:thumbnail.png voice_clean.words.json:words.json; do
            src="$ED/${pair%%:*}"; if [ -f "$src" ]; then cp "$src" "$R/$P-${pair##*:}"; fi
          done
          ls -1 "$R"
          gh release view "$DATE" >/dev/null 2>&1 || gh release create "$DATE" -t "Isobar News $DATE" -n "Draft, recording script, description and social copy"
          gh release upload "$DATE" "$R"/* --clobber
          # drop assets left over from the old naming scheme, if any
          for old in recording.md description.txt title.txt thumbnail.png voice_clean.words.json; do gh release delete-asset "$DATE" "$old" -y >/dev/null 2>&1 || true; done
          [ -f "$ED/photos.md" ] && gh release edit "$DATE" --notes "Draft, recording script, description and ready-to-post social copy ($P-social-<platform>.txt). Photo choices and alternatives: https://github.com/${{ github.repository }}/blob/main/editions/$DATE/photos.md" || true
      - name: Commit script updates
        run: |
          git config user.name "isobar-bot"; git config user.email "bot@isobar.news"
          git add editions/$DATE/script.json editions/$DATE/recording.md editions/$DATE/description.txt $( [ -f editions/$DATE/photos.md ] && echo editions/$DATE/photos.md ) $( [ -d editions/$DATE/social ] && echo editions/$DATE/social ) && git commit -m "Edition $DATE: $KIND rendered" && { git pull --rebase --autostash -q && git push; } || true
