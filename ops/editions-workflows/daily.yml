# Lives in EmergentInventions/isobar-editions (private). Fetches today's stories and writes an automatic draft script.
name: daily-fetch
on:
  schedule:            # several tries, away from minute 0; the first that runs does the work
    - cron: "2 12 * * *"
    - cron: "17 12 * * *"
    - cron: "33 12 * * *"
  workflow_dispatch:
    inputs:
      date: { description: "YYYY-MM-DD (UTC)", required: false }
concurrency: { group: daily-fetch, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: EmergentInventions/isobar, path: code }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: code/requirements.txt }
      - run: pip install -r code/requirements.txt
      - name: Fetch (Kagi, then backup feeds)
        env: { PYTHONPATH: code }
        run: |
          DATE="${{ inputs.date }}"; DATE="${DATE:-$(date -u +%F)}"; echo "DATE=$DATE" >> "$GITHUB_ENV"
          if [ -f "editions/$DATE/stories.json" ]; then echo "already fetched"; echo "DONE=1" >> "$GITHUB_ENV"; exit 0; fi
          python -m isobar.fetch_kagi --base . --date "$DATE" --deadline 12:45 || python -m isobar.fetch_backup --base . --date "$DATE"
      - name: Rank and draft script
        if: env.DONE != '1'
        env: { PYTHONPATH: code }
        run: |
          python -m isobar.rank --base . --date "$DATE"
          python -m isobar.script --base . --date "$DATE"
          python -m isobar.voice "editions/$DATE"
      - name: Commit
        if: env.DONE != '1'
        run: |
          git config user.name "isobar-bot"; git config user.email "bot@isobar.news"
          git add "editions/$DATE"; git commit -m "Edition $DATE: stories and draft script" && git push
